<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 800" width="1800" height="800" font-family="'DM Sans', Arial, Helvetica, sans-serif">
  <!-- 4 Nov 2026 — the Getting started flow for the guide's "Getting started:
       your first roster" section. Edit this, then re-export the PNG at 1800 px wide.
       9 Nov 2026 — redrawn: the New Roster wizard now gets the volunteers in and
       walks every profile, so getting started is two jobs, not four.
       Export: wrap in HTML that loads DM Sans from Google Fonts and screenshot
       with headless Chrome at 1800x800. -->
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2b4570"/>
    </marker>
  </defs>

  <rect width="1800" height="800" fill="#f7f9fb"/>

  <text x="900" y="70" text-anchor="middle" font-size="44" font-weight="700" fill="#1a2e4a">Getting started: your first roster</text>
  <text x="900" y="112" text-anchor="middle" font-size="24" fill="#5a6a7e">Allow 20–30 minutes the first time. After that, a build takes about 10 minutes.</text>

  <!-- Job 1: the New Roster wizard -->
  <text x="60" y="154" font-size="24" font-weight="700" fill="#b8932a">1. Set up the roster with the New Roster wizard (once for each roster)</text>
  <g font-size="20" text-anchor="middle" fill="#5a6a7e">
    <g transform="translate(60,190)">
      <rect width="390" height="230" rx="16" fill="#ffffff" stroke="#1a2e4a" stroke-width="3"/>
      <text x="195" y="56" font-size="26" font-weight="700" fill="#1a2e4a">Name, roles &amp; season</text>
      <text x="195" y="104">What the roster is</text>
      <text x="195" y="134">and when it runs</text>
    </g>
    <g transform="translate(480,190)">
      <rect width="390" height="230" rx="16" fill="#ffffff" stroke="#1a2e4a" stroke-width="3"/>
      <text x="195" y="56" font-size="26" font-weight="700" fill="#1a2e4a">Volunteers</text>
      <text x="195" y="100">Connect Infoodle, Planning</text>
      <text x="195" y="128">Center or a Google Sheet,</text>
      <text x="195" y="160">or import Excel, CSV or</text>
      <text x="195" y="188">phone contacts, or add a few</text>
    </g>
    <g transform="translate(900,190)">
      <rect width="390" height="230" rx="16" fill="#ffffff" stroke="#1a2e4a" stroke-width="3"/>
      <text x="195" y="56" font-size="26" font-weight="700" fill="#1a2e4a">Set up each volunteer</text>
      <text x="195" y="100">Roles, how often, who they</text>
      <text x="195" y="128">serve with, role links.</text>
      <text x="195" y="156">Press › for the next one</text>
      <text x="195" y="198" font-weight="700" fill="#b8932a">No roles = left out of the build</text>
    </g>
    <g transform="translate(1320,190)">
      <rect width="420" height="230" rx="16" fill="#ffffff" stroke="#1a2e4a" stroke-width="3"/>
      <text x="210" y="56" font-size="26" font-weight="700" fill="#1a2e4a">Review &amp; create</text>
      <text x="210" y="104">Check the summary,</text>
      <text x="210" y="134">then Create Roster</text>
    </g>
  </g>
  <g stroke="#2b4570" stroke-width="3" fill="none" marker-end="url(#arr)">
    <line x1="452" y1="305" x2="476" y2="305"/>
    <line x1="872" y1="305" x2="896" y2="305"/>
    <line x1="1292" y1="305" x2="1316" y2="305"/>
    <path d="M1530,422 L1530,448 L207,448 L207,532"/>
  </g>

  <!-- Job 2: the roster cycle -->
  <text x="240" y="500" font-size="24" font-weight="700" fill="#b8932a">2. Run the roster cycle: build, check, then send</text>
  <g font-size="19" text-anchor="middle" fill="#5a6a7e">
    <g transform="translate(80,536)">
      <rect width="255" height="110" rx="14" fill="#ffffff" stroke="#1a2e4a" stroke-width="3"/>
      <text x="127" y="50" font-size="22" font-weight="700" fill="#1a2e4a">Confirm Dates</text>
      <text x="127" y="82">which dates to build</text>
    </g>
    <g transform="translate(357,536)">
      <rect width="255" height="110" rx="14" fill="#ffffff" stroke="#1a2e4a" stroke-width="3"/>
      <text x="127" y="50" font-size="22" font-weight="700" fill="#1a2e4a">Roles</text>
      <text x="127" y="82">headcount per role</text>
    </g>
    <g transform="translate(634,536)">
      <rect width="255" height="110" rx="14" fill="#ffffff" stroke="#1a2e4a" stroke-width="3" stroke-dasharray="10 7"/>
      <text x="127" y="50" font-size="22" font-weight="700" fill="#1a2e4a">Role Prefs</text>
      <text x="127" y="82">optional</text>
    </g>
    <g transform="translate(911,536)">
      <rect width="255" height="110" rx="14" fill="#ffffff" stroke="#1a2e4a" stroke-width="3" stroke-dasharray="10 7"/>
      <text x="127" y="50" font-size="22" font-weight="700" fill="#1a2e4a">Availability</text>
      <text x="127" y="82">optional</text>
    </g>
    <g transform="translate(1188,536)">
      <rect width="255" height="110" rx="14" fill="#ffffff" stroke="#1a2e4a" stroke-width="3"/>
      <text x="127" y="50" font-size="22" font-weight="700" fill="#1a2e4a">Build &amp; Check</text>
      <text x="127" y="82">check it on the Board</text>
    </g>
    <g transform="translate(1465,536)">
      <rect width="255" height="110" rx="14" fill="#ffffff" stroke="#1a2e4a" stroke-width="3"/>
      <text x="127" y="50" font-size="22" font-weight="700" fill="#1a2e4a">Notify</text>
      <text x="127" y="82">test mode off, then send</text>
    </g>
  </g>
  <g stroke="#2b4570" stroke-width="3" fill="none" marker-end="url(#arr)">
    <line x1="337" y1="591" x2="353" y2="591"/>
    <line x1="614" y1="591" x2="630" y2="591"/>
    <line x1="891" y1="591" x2="907" y2="591"/>
    <line x1="1168" y1="591" x2="1184" y2="591"/>
    <line x1="1445" y1="591" x2="1461" y2="591"/>
  </g>

  <!-- 9 Nov 2026: letter badges match the guide's 1A–1D and 2A–2F headings -->
  <g font-size="22" font-weight="700" text-anchor="middle" fill="#ffffff">
    <rect x="80" y="172" width="62" height="36" rx="18" fill="#b8932a" stroke="#f7f9fb" stroke-width="4"/><text x="111" y="198">1A</text>
    <rect x="500" y="172" width="62" height="36" rx="18" fill="#b8932a" stroke="#f7f9fb" stroke-width="4"/><text x="531" y="198">1B</text>
    <rect x="920" y="172" width="62" height="36" rx="18" fill="#b8932a" stroke="#f7f9fb" stroke-width="4"/><text x="951" y="198">1C</text>
    <rect x="1340" y="172" width="62" height="36" rx="18" fill="#b8932a" stroke="#f7f9fb" stroke-width="4"/><text x="1371" y="198">1D</text>
    <rect x="100" y="518" width="62" height="36" rx="18" fill="#b8932a" stroke="#f7f9fb" stroke-width="4"/><text x="131" y="544">2A</text>
    <rect x="377" y="518" width="62" height="36" rx="18" fill="#b8932a" stroke="#f7f9fb" stroke-width="4"/><text x="408" y="544">2B</text>
    <rect x="654" y="518" width="62" height="36" rx="18" fill="#b8932a" stroke="#f7f9fb" stroke-width="4"/><text x="685" y="544">2C</text>
    <rect x="931" y="518" width="62" height="36" rx="18" fill="#b8932a" stroke="#f7f9fb" stroke-width="4"/><text x="962" y="544">2D</text>
    <rect x="1208" y="518" width="62" height="36" rx="18" fill="#b8932a" stroke="#f7f9fb" stroke-width="4"/><text x="1239" y="544">2E</text>
    <rect x="1485" y="518" width="62" height="36" rx="18" fill="#b8932a" stroke="#f7f9fb" stroke-width="4"/><text x="1516" y="544">2F</text>
  </g>
  <rect x="60" y="690" width="1680" height="70" rx="16" fill="#1a2e4a"/>
  <text x="900" y="734" text-anchor="middle" font-size="26" font-weight="700" fill="#ffffff">Next time, start at 2A. Only volunteers who are new since the last build need setting up.</text>
</svg>
