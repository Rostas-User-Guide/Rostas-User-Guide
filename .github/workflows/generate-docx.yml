name: Generate Coordinator Guide DOCX

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'generate_docx.js'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Generate DOCX
        run: node generate_docx.js --local ./index.html --images .

      - name: Install LibreOffice
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer libreoffice-core python3-uno

      - name: Convert DOCX to PDF (with TOC update)
        run: python3 convert_pdf.py

      - name: Commit and push files
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add Rostas_Coordinator_Guide.pdf
          git diff --staged --quiet || git commit -m "Auto-regenerate Coordinator Guide (DOCX + PDF)"
          git push

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
