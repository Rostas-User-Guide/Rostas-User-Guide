<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 820" width="1800" height="820" font-family="'DM Sans', Arial, Helvetica, sans-serif">
  <!-- 2 Nov 2026 — redrawn by hand to replace the NotebookLM slide
       (Rostas_Intelligent_Roster_Assistant-6.jpg), which still said
       "Run Sheet Wizard" and used the old step names. Step names match
       wzHorizStepper_() in Phase11_CoordinatorDashboard.js.
       10 Nov 2026 — text enlarged (smallest 28px at 1800 wide) for 14-inch
       screens; same export as getting-started-flow.svg. -->
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2b4570"/></marker>
    <marker id="arrGold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8932a"/></marker>
  </defs>
  <rect width="1800" height="820" fill="#f7f9fb"/>
  <text x="900" y="78" text-anchor="middle" font-size="54" font-weight="700" fill="#1a2e4a">The roster cycle</text>
  <text x="900" y="132" text-anchor="middle" font-size="34" fill="#5a6a7e">Open a roster from the Builds page and work through six steps, one button at a time</text>
  <g>
    <rect x="30" y="214" width="270" height="370" rx="18" fill="#ffffff" stroke="#1a2e4a" stroke-width="3"/>
    <circle cx="165.0" cy="214" r="33" fill="#1a2e4a"/>
    <text x="165.0" y="226" text-anchor="middle" font-size="33" font-weight="700" fill="#ffffff">1</text>
    <text x="165.0" y="300" text-anchor="middle" font-size="32" font-weight="700" fill="#1a2e4a">Confirm Dates</text>
    <text x="165.0" y="356" text-anchor="middle" font-size="29" fill="#5a6a7e">Which dates this</text>
    <text x="165.0" y="396" text-anchor="middle" font-size="29" fill="#5a6a7e">build covers.</text>
    <text x="165.0" y="436" text-anchor="middle" font-size="29" fill="#5a6a7e">Holidays are</text>
    <text x="165.0" y="476" text-anchor="middle" font-size="29" fill="#5a6a7e">already marked</text>
  </g>
  <g>
    <rect x="324" y="214" width="270" height="370" rx="18" fill="#ffffff" stroke="#1a2e4a" stroke-width="3"/>
    <circle cx="459.0" cy="214" r="33" fill="#1a2e4a"/>
    <text x="459.0" y="226" text-anchor="middle" font-size="33" font-weight="700" fill="#ffffff">2</text>
    <text x="459.0" y="300" text-anchor="middle" font-size="32" font-weight="700" fill="#1a2e4a">Roles</text>
    <text x="459.0" y="356" text-anchor="middle" font-size="29" fill="#5a6a7e">Which roles are</text>
    <text x="459.0" y="396" text-anchor="middle" font-size="29" fill="#5a6a7e">needed, and how</text>
    <text x="459.0" y="436" text-anchor="middle" font-size="29" fill="#5a6a7e">many for each</text>
  </g>
  <g>
    <rect x="618" y="214" width="270" height="370" rx="18" fill="#fdf8ee" stroke="#b8932a" stroke-width="3" stroke-dasharray="12 8"/>
    <circle cx="753.0" cy="214" r="33" fill="#b8932a"/>
    <text x="753.0" y="226" text-anchor="middle" font-size="33" font-weight="700" fill="#ffffff">3</text>
    <text x="753.0" y="300" text-anchor="middle" font-size="32" font-weight="700" fill="#1a2e4a">Role Prefs</text>
    <text x="753.0" y="356" text-anchor="middle" font-size="29" fill="#5a6a7e">Who is willing</text>
    <text x="753.0" y="396" text-anchor="middle" font-size="29" fill="#5a6a7e">to do each role.</text>
    <text x="753.0" y="436" text-anchor="middle" font-size="29" fill="#5a6a7e">Remembered</text>
    <text x="753.0" y="476" text-anchor="middle" font-size="29" fill="#5a6a7e">next time</text>
    <rect x="675.0" y="522" width="156" height="46" rx="23" fill="#b8932a"/>
    <text x="753.0" y="555" text-anchor="middle" font-size="28" font-weight="700" fill="#ffffff">Can skip</text>
  </g>
  <g>
    <rect x="912" y="214" width="270" height="370" rx="18" fill="#fdf8ee" stroke="#b8932a" stroke-width="3" stroke-dasharray="12 8"/>
    <circle cx="1047.0" cy="214" r="33" fill="#b8932a"/>
    <text x="1047.0" y="226" text-anchor="middle" font-size="33" font-weight="700" fill="#ffffff">4</text>
    <text x="1047.0" y="300" text-anchor="middle" font-size="32" font-weight="700" fill="#1a2e4a">Availability</text>
    <text x="1047.0" y="356" text-anchor="middle" font-size="29" fill="#5a6a7e">Volunteers say</text>
    <text x="1047.0" y="396" text-anchor="middle" font-size="29" fill="#5a6a7e">which dates they</text>
    <text x="1047.0" y="436" text-anchor="middle" font-size="29" fill="#5a6a7e">can do (app,</text>
    <text x="1047.0" y="476" text-anchor="middle" font-size="29" fill="#5a6a7e">email or text)</text>
    <rect x="969.0" y="522" width="156" height="46" rx="23" fill="#b8932a"/>
    <text x="1047.0" y="555" text-anchor="middle" font-size="28" font-weight="700" fill="#ffffff">Can skip</text>
  </g>
  <g>
    <rect x="1206" y="214" width="270" height="370" rx="18" fill="#ffffff" stroke="#1a2e4a" stroke-width="3"/>
    <circle cx="1341.0" cy="214" r="33" fill="#1a2e4a"/>
    <text x="1341.0" y="226" text-anchor="middle" font-size="33" font-weight="700" fill="#ffffff">5</text>
    <text x="1341.0" y="300" text-anchor="middle" font-size="32" font-weight="700" fill="#1a2e4a">Build &amp; Check</text>
    <text x="1341.0" y="356" text-anchor="middle" font-size="29" fill="#5a6a7e">Rostas fills the</text>
    <text x="1341.0" y="396" text-anchor="middle" font-size="29" fill="#5a6a7e">slots. You check</text>
    <text x="1341.0" y="436" text-anchor="middle" font-size="29" fill="#5a6a7e">and swap on</text>
    <text x="1341.0" y="476" text-anchor="middle" font-size="29" fill="#5a6a7e">the Board</text>
  </g>
  <g>
    <rect x="1500" y="214" width="270" height="370" rx="18" fill="#1a2e4a" stroke="#1a2e4a" stroke-width="3"/>
    <circle cx="1635.0" cy="214" r="33" fill="#b8932a"/>
    <text x="1635.0" y="226" text-anchor="middle" font-size="33" font-weight="700" fill="#ffffff">6</text>
    <text x="1635.0" y="300" text-anchor="middle" font-size="32" font-weight="700" fill="#ffffff">Notify</text>
    <text x="1635.0" y="356" text-anchor="middle" font-size="29" fill="#dde4ed">Everyone hears</text>
    <text x="1635.0" y="396" text-anchor="middle" font-size="29" fill="#dde4ed">their dates.</text>
    <text x="1635.0" y="436" text-anchor="middle" font-size="29" fill="#dde4ed">Reminders follow</text>
    <text x="1635.0" y="476" text-anchor="middle" font-size="29" fill="#dde4ed">automatically</text>
  </g>
  <g stroke="#2b4570" stroke-width="3" fill="none" marker-end="url(#arr)">
    <line x1="301" y1="399.0" x2="322" y2="399.0"/>
    <line x1="595" y1="399.0" x2="616" y2="399.0"/>
    <line x1="889" y1="399.0" x2="910" y2="399.0"/>
    <line x1="1183" y1="399.0" x2="1204" y2="399.0"/>
    <line x1="1477" y1="399.0" x2="1498" y2="399.0"/>
  </g>
  <path d="M1635.0,586 V674 H165.0 V594" fill="none" stroke="#b8932a" stroke-width="3" marker-end="url(#arrGold)"/>
  <rect x="540" y="648" width="720" height="52" rx="26" fill="#f7f9fb"/>
  <text x="900" y="686" text-anchor="middle" font-size="33" font-weight="700" fill="#b8932a">Next cycle: start again at Confirm Dates</text>
  <text x="900" y="780" text-anchor="middle" font-size="31" fill="#5a6a7e">Dashed steps can be skipped: Rostas then builds with everyone's saved roles, or with everyone available.</text>
</svg>
