<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 980" width="1800" height="980" font-family="'DM Sans', Arial, Helvetica, sans-serif">
  <!-- 4 Nov 2026 — the Getting started flow for the guide's "Getting started:
       your first roster" section. 9 Nov 2026 — two jobs, lettered 1A–1D and
       2A–2F to match the guide's headings. 10 Nov 2026 — text enlarged (smallest
       24px at 1800 wide) because it was unreadable on a 14-inch screen.
       Export: wrap in HTML that loads DM Sans from Google Fonts and screenshot
       with headless Chrome at the viewBox size. -->
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2b4570"/></marker>
    <marker id="arrGold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8932a"/></marker>
  </defs>
  <rect width="1800" height="980" fill="#f7f9fb"/>
  <text x="900" y="72" text-anchor="middle" font-size="50" font-weight="700" fill="#1a2e4a">Getting started: your first roster</text>
  <text x="900" y="122" text-anchor="middle" font-size="30" fill="#5a6a7e">Allow 20–30 minutes the first time. After that, a build takes about 10 minutes.</text>
  <text x="50" y="186" font-size="30" font-weight="700" fill="#b8932a">1. Set up the roster with the New Roster wizard (once for each roster)</text>
  <g>
    <rect x="50" y="222" width="405" height="300" rx="18" fill="#ffffff" stroke="#1a2e4a" stroke-width="3"/>
    <text x="252.5" y="288" text-anchor="middle" font-size="33" font-weight="700" fill="#1a2e4a">Name, roles &amp; season</text>
    <text x="252.5" y="344" text-anchor="middle" font-size="26" fill="#5a6a7e">What the roster is</text>
    <text x="252.5" y="380" text-anchor="middle" font-size="26" fill="#5a6a7e">and when it runs</text>
    <rect x="72" y="201" width="78" height="42" rx="21" fill="#b8932a" stroke="#f7f9fb" stroke-width="4"/>
    <text x="111.0" y="231" text-anchor="middle" font-size="27" font-weight="700" fill="#ffffff">1A</text>
  </g>
  <g>
    <rect x="480" y="222" width="405" height="300" rx="18" fill="#ffffff" stroke="#1a2e4a" stroke-width="3"/>
    <text x="682.5" y="288" text-anchor="middle" font-size="33" font-weight="700" fill="#1a2e4a">Volunteers</text>
    <text x="682.5" y="344" text-anchor="middle" font-size="26" fill="#5a6a7e">Connect Infoodle, Planning</text>
    <text x="682.5" y="380" text-anchor="middle" font-size="26" fill="#5a6a7e">Center or a Google Sheet,</text>
    <text x="682.5" y="416" text-anchor="middle" font-size="26" fill="#5a6a7e">or import Excel, CSV or</text>
    <text x="682.5" y="452" text-anchor="middle" font-size="26" fill="#5a6a7e">phone contacts, or add a few</text>
    <rect x="502" y="201" width="78" height="42" rx="21" fill="#b8932a" stroke="#f7f9fb" stroke-width="4"/>
    <text x="541.0" y="231" text-anchor="middle" font-size="27" font-weight="700" fill="#ffffff">1B</text>
  </g>
  <g>
    <rect x="910" y="222" width="405" height="300" rx="18" fill="#ffffff" stroke="#1a2e4a" stroke-width="3"/>
    <text x="1112.5" y="288" text-anchor="middle" font-size="33" font-weight="700" fill="#1a2e4a">Set up each volunteer</text>
    <text x="1112.5" y="344" text-anchor="middle" font-size="26" fill="#5a6a7e">Roles, how often, who they</text>
    <text x="1112.5" y="380" text-anchor="middle" font-size="26" fill="#5a6a7e">serve with, role links.</text>
    <text x="1112.5" y="416" text-anchor="middle" font-size="26" fill="#5a6a7e">Press › for the next one</text>
    <text x="1112.5" y="466" text-anchor="middle" font-size="26" font-weight="700" fill="#b8932a">No roles = left out</text>
    <text x="1112.5" y="500" text-anchor="middle" font-size="26" font-weight="700" fill="#b8932a">of the build</text>
    <rect x="932" y="201" width="78" height="42" rx="21" fill="#b8932a" stroke="#f7f9fb" stroke-width="4"/>
    <text x="971.0" y="231" text-anchor="middle" font-size="27" font-weight="700" fill="#ffffff">1C</text>
  </g>
  <g>
    <rect x="1340" y="222" width="405" height="300" rx="18" fill="#ffffff" stroke="#1a2e4a" stroke-width="3"/>
    <text x="1542.5" y="288" text-anchor="middle" font-size="33" font-weight="700" fill="#1a2e4a">Review &amp; create</text>
    <text x="1542.5" y="344" text-anchor="middle" font-size="26" fill="#5a6a7e">Check the summary,</text>
    <text x="1542.5" y="380" text-anchor="middle" font-size="26" fill="#5a6a7e">then Create Roster</text>
    <rect x="1362" y="201" width="78" height="42" rx="21" fill="#b8932a" stroke="#f7f9fb" stroke-width="4"/>
    <text x="1401.0" y="231" text-anchor="middle" font-size="27" font-weight="700" fill="#ffffff">1D</text>
  </g>
  <g stroke="#2b4570" stroke-width="3" fill="none" marker-end="url(#arr)">
    <line x1="456" y1="372.0" x2="478" y2="372.0"/>
    <line x1="886" y1="372.0" x2="908" y2="372.0"/>
    <line x1="1316" y1="372.0" x2="1338" y2="372.0"/>
    <path d="M1542.5,524 L1542.5,562 L167.5,562 L167.5,626"/>
  </g>
  <text x="237.5" y="596" font-size="30" font-weight="700" fill="#b8932a">2. Run the roster cycle: build, check, then send</text>
  <g>
    <rect x="35" y="652" width="265" height="176" rx="16" fill="#ffffff" stroke="#1a2e4a" stroke-width="3"/>
    <text x="167.5" y="718" text-anchor="middle" font-size="29" font-weight="700" fill="#1a2e4a">Confirm Dates</text>
    <text x="167.5" y="762" text-anchor="middle" font-size="24" fill="#5a6a7e">which dates</text>
    <text x="167.5" y="794" text-anchor="middle" font-size="24" fill="#5a6a7e">to build</text>
    <rect x="55" y="631" width="78" height="42" rx="21" fill="#b8932a" stroke="#f7f9fb" stroke-width="4"/>
    <text x="94.0" y="661" text-anchor="middle" font-size="27" font-weight="700" fill="#ffffff">2A</text>
  </g>
  <g>
    <rect x="328" y="652" width="265" height="176" rx="16" fill="#ffffff" stroke="#1a2e4a" stroke-width="3"/>
    <text x="460.5" y="718" text-anchor="middle" font-size="29" font-weight="700" fill="#1a2e4a">Roles</text>
    <text x="460.5" y="762" text-anchor="middle" font-size="24" fill="#5a6a7e">headcount</text>
    <text x="460.5" y="794" text-anchor="middle" font-size="24" fill="#5a6a7e">per role</text>
    <rect x="348" y="631" width="78" height="42" rx="21" fill="#b8932a" stroke="#f7f9fb" stroke-width="4"/>
    <text x="387.0" y="661" text-anchor="middle" font-size="27" font-weight="700" fill="#ffffff">2B</text>
  </g>
  <g>
    <rect x="621" y="652" width="265" height="176" rx="16" fill="#ffffff" stroke="#1a2e4a" stroke-width="3" stroke-dasharray="12 8"/>
    <text x="753.5" y="718" text-anchor="middle" font-size="29" font-weight="700" fill="#1a2e4a">Role Prefs</text>
    <text x="753.5" y="762" text-anchor="middle" font-size="24" fill="#5a6a7e">optional</text>
    <rect x="641" y="631" width="78" height="42" rx="21" fill="#b8932a" stroke="#f7f9fb" stroke-width="4"/>
    <text x="680.0" y="661" text-anchor="middle" font-size="27" font-weight="700" fill="#ffffff">2C</text>
  </g>
  <g>
    <rect x="914" y="652" width="265" height="176" rx="16" fill="#ffffff" stroke="#1a2e4a" stroke-width="3" stroke-dasharray="12 8"/>
    <text x="1046.5" y="718" text-anchor="middle" font-size="29" font-weight="700" fill="#1a2e4a">Availability</text>
    <text x="1046.5" y="762" text-anchor="middle" font-size="24" fill="#5a6a7e">optional</text>
    <rect x="934" y="631" width="78" height="42" rx="21" fill="#b8932a" stroke="#f7f9fb" stroke-width="4"/>
    <text x="973.0" y="661" text-anchor="middle" font-size="27" font-weight="700" fill="#ffffff">2D</text>
  </g>
  <g>
    <rect x="1207" y="652" width="265" height="176" rx="16" fill="#ffffff" stroke="#1a2e4a" stroke-width="3"/>
    <text x="1339.5" y="718" text-anchor="middle" font-size="29" font-weight="700" fill="#1a2e4a">Build &amp; Check</text>
    <text x="1339.5" y="762" text-anchor="middle" font-size="24" fill="#5a6a7e">check it on</text>
    <text x="1339.5" y="794" text-anchor="middle" font-size="24" fill="#5a6a7e">the Board</text>
    <rect x="1227" y="631" width="78" height="42" rx="21" fill="#b8932a" stroke="#f7f9fb" stroke-width="4"/>
    <text x="1266.0" y="661" text-anchor="middle" font-size="27" font-weight="700" fill="#ffffff">2E</text>
  </g>
  <g>
    <rect x="1500" y="652" width="265" height="176" rx="16" fill="#ffffff" stroke="#1a2e4a" stroke-width="3"/>
    <text x="1632.5" y="718" text-anchor="middle" font-size="29" font-weight="700" fill="#1a2e4a">Notify</text>
    <text x="1632.5" y="762" text-anchor="middle" font-size="24" fill="#5a6a7e">test modes off,</text>
    <text x="1632.5" y="794" text-anchor="middle" font-size="24" fill="#5a6a7e">then send</text>
    <rect x="1520" y="631" width="78" height="42" rx="21" fill="#b8932a" stroke="#f7f9fb" stroke-width="4"/>
    <text x="1559.0" y="661" text-anchor="middle" font-size="27" font-weight="700" fill="#ffffff">2F</text>
  </g>
  <g stroke="#2b4570" stroke-width="3" fill="none" marker-end="url(#arr)">
    <line x1="301" y1="740.0" x2="326" y2="740.0"/>
    <line x1="594" y1="740.0" x2="619" y2="740.0"/>
    <line x1="887" y1="740.0" x2="912" y2="740.0"/>
    <line x1="1180" y1="740.0" x2="1205" y2="740.0"/>
    <line x1="1473" y1="740.0" x2="1498" y2="740.0"/>
  </g>
  <rect x="50" y="872" width="1700" height="80" rx="18" fill="#1a2e4a"/>
  <text x="900" y="923" text-anchor="middle" font-size="30" font-weight="700" fill="#ffffff">Next time, start at 2A. Only volunteers who are new since the last build need setting up.</text>
</svg>
