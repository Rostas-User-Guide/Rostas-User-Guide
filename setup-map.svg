<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 2720" width="1800" height="2720" font-family="'DM Sans', Arial, Helvetica, sans-serif">
  <!-- 13 Nov 2026 — Getting started map for the top of Part B, from the
       Rostas Getting Started whiteboard. Generated by make_setup_map.py:
       edit that, not this file. Three steps per row so the text stays
       readable in the guide's 840px column on a 14-inch screen.
       Export: wrap in HTML that loads DM Sans from Google Fonts and screenshot
       with headless Chrome at 1800x2720. -->
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2b4570"/></marker>
    <marker id="arrGold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8932a"/></marker>
  </defs>
  <rect width="1800" height="2720" fill="#f7f9fb"/>
  <text x="900.0" y="82" font-size="60" font-weight="700" fill="#1a2e4a" text-anchor="middle">Getting started with Rostas</text>
  <text x="900.0" y="142" font-size="36" font-weight="400" fill="#5a6a7e" text-anchor="middle">Copy it, set it up, build your first roster, then send it.</text>
  <rect x="50" y="178" width="1720" height="80" rx="18" fill="#1a2e4a"/>
  <text x="900.0" y="230" font-size="34" text-anchor="middle" fill="#ffffff"><tspan font-weight="700">Before you start: </tspan>use a computer, have your licence key, and keep one Google account per browser</text>
  <rect x="50" y="300" width="70" height="40" rx="10" fill="#fdf3dc" stroke="#b8932a" stroke-width="5"/>
  <text x="138" y="332" font-size="34" font-weight="400" fill="#1a2e4a" text-anchor="start">Don&#x27;t skip this</text>
  <rect x="600" y="300" width="70" height="40" rx="10" fill="#ffffff" stroke="#1a2e4a" stroke-width="3" stroke-dasharray="14 9"/>
  <text x="688" y="332" font-size="34" font-weight="400" fill="#1a2e4a" text-anchor="start">Optional</text>
  <rect x="1000" y="300" width="70" height="40" rx="10" fill="#fff1c2"/>
  <text x="1088" y="332" font-size="34" font-weight="400" fill="#1a2e4a" text-anchor="start">A decision to make</text>
  <text x="50" y="420" font-size="40" font-weight="700" fill="#b8932a">1 · Make your copy of Rostas<tspan font-weight="400" font-size="34" fill="#5a6a7e">  (about 10 minutes, once)</tspan></text>
  <g>
  <rect x="50" y="450" width="520" height="190" rx="18" fill="#ffffff" stroke="#1a2e4a" stroke-width="3"/>
  <text x="310.0" y="538" font-size="40" font-weight="700" fill="#1a2e4a" text-anchor="middle">Make your copy</text>
  <text x="310.0" y="588" font-size="34" font-weight="400" fill="#5a6a7e" text-anchor="middle">From your welcome page</text>
  </g>
  <g>
  <rect x="650" y="450" width="520" height="190" rx="18" fill="#ffffff" stroke="#1a2e4a" stroke-width="3" stroke-dasharray="14 9"/>
  <text x="910.0" y="517" font-size="40" font-weight="700" fill="#1a2e4a" text-anchor="middle">Share for updates</text>
  <text x="910.0" y="567" font-size="34" font-weight="400" fill="#5a6a7e" text-anchor="middle">rostasapp@gmail.com</text>
  <text x="910.0" y="609" font-size="34" font-weight="400" fill="#5a6a7e" text-anchor="middle">as Editor</text>
  </g>
  <g>
  <rect x="1250" y="450" width="520" height="190" rx="18" fill="#ffffff" stroke="#1a2e4a" stroke-width="3"/>
  <text x="1510.0" y="517" font-size="40" font-weight="700" fill="#1a2e4a" text-anchor="middle">Deploy as Web app</text>
  <text x="1510.0" y="567" font-size="34" font-weight="400" fill="#5a6a7e" text-anchor="middle">Extensions → Apps Script</text>
  <text x="1510.0" y="609" font-size="34" font-weight="400" fill="#5a6a7e" text-anchor="middle">→ Deploy</text>
  </g>
  <g>
  <rect x="50" y="710" width="520" height="190" rx="18" fill="#ffffff" stroke="#1a2e4a" stroke-width="3"/>
  <text x="310.0" y="798" font-size="40" font-weight="700" fill="#1a2e4a" text-anchor="middle">Google&#x27;s warning</text>
  <text x="310.0" y="848" font-size="34" font-weight="400" fill="#5a6a7e" text-anchor="middle">Advanced → Go to… (unsafe)</text>
  </g>
  <g>
  <rect x="650" y="710" width="520" height="190" rx="18" fill="#fdf3dc" stroke="#b8932a" stroke-width="5"/>
  <text x="910.0" y="798" font-size="40" font-weight="700" fill="#1a2e4a" text-anchor="middle">Tick Select all</text>
  <text x="910.0" y="848" font-size="34" font-weight="400" fill="#5a6a7e" text-anchor="middle">then Continue</text>
  </g>
  <g>
  <rect x="1250" y="710" width="520" height="190" rx="18" fill="#ffffff" stroke="#1a2e4a" stroke-width="3"/>
  <text x="1510.0" y="777" font-size="40" font-weight="700" fill="#1a2e4a" text-anchor="middle">Open Rostas</text>
  <text x="1510.0" y="827" font-size="34" font-weight="400" fill="#5a6a7e" text-anchor="middle">Open the Web app URL</text>
  <text x="1510.0" y="869" font-size="34" font-weight="400" fill="#5a6a7e" text-anchor="middle">and bookmark it</text>
  </g>
  <g stroke="#2b4570" stroke-width="3" fill="none" marker-end="url(#arr)">
  <line x1="573" y1="545.0" x2="646" y2="545.0"/>
  <line x1="1173" y1="545.0" x2="1246" y2="545.0"/>
  <path d="M1510.0,643 L1510.0,675.0 L310.0,675.0 L310.0,706"/>
  <line x1="573" y1="805.0" x2="646" y2="805.0"/>
  <line x1="1173" y1="805.0" x2="1246" y2="805.0"/>
  </g>
  <text x="50" y="980" font-size="40" font-weight="700" fill="#b8932a">2 · Setup Wizard<tspan font-weight="400" font-size="34" fill="#5a6a7e">  (about 5 minutes, once)</tspan></text>
  <g>
  <rect x="50" y="1010" width="520" height="190" rx="18" fill="#ffffff" stroke="#1a2e4a" stroke-width="3"/>
  <text x="310.0" y="1098" font-size="40" font-weight="700" fill="#1a2e4a" text-anchor="middle">1  Licence</text>
  <text x="310.0" y="1148" font-size="34" font-weight="400" fill="#5a6a7e" text-anchor="middle">Key from your welcome email</text>
  </g>
  <g>
  <rect x="650" y="1010" width="520" height="190" rx="18" fill="#ffffff" stroke="#1a2e4a" stroke-width="3"/>
  <text x="910.0" y="1098" font-size="40" font-weight="700" fill="#1a2e4a" text-anchor="middle">2  Organisation</text>
  <text x="910.0" y="1148" font-size="34" font-weight="400" fill="#5a6a7e" text-anchor="middle">Name, timezone, country</text>
  </g>
  <g>
  <rect x="1250" y="1010" width="520" height="190" rx="18" fill="#ffffff" stroke="#1a2e4a" stroke-width="3"/>
  <text x="1510.0" y="1077" font-size="40" font-weight="700" fill="#1a2e4a" text-anchor="middle">3  Your details</text>
  <text x="1510.0" y="1127" font-size="34" font-weight="400" fill="#5a6a7e" text-anchor="middle">Name, email, and mobile</text>
  <text x="1510.0" y="1169" font-size="34" font-weight="400" fill="#5a6a7e" text-anchor="middle">with country code</text>
  </g>
  <g>
  <rect x="50" y="1270" width="520" height="190" rx="18" fill="#ffffff" stroke="#1a2e4a" stroke-width="3"/>
  <text x="310.0" y="1358" font-size="40" font-weight="700" fill="#1a2e4a" text-anchor="middle">4  SMS test</text>
  <text x="310.0" y="1408" font-size="34" font-weight="400" fill="#5a6a7e" text-anchor="middle">Or Continue without SMS</text>
  </g>
  <g>
  <rect x="650" y="1270" width="520" height="190" rx="18" fill="#ffffff" stroke="#1a2e4a" stroke-width="3"/>
  <text x="910.0" y="1358" font-size="40" font-weight="700" fill="#1a2e4a" text-anchor="middle">5  Done</text>
  <text x="910.0" y="1408" font-size="34" font-weight="400" fill="#5a6a7e" text-anchor="middle">Go to Build</text>
  </g>
  <g>
  <rect x="1250" y="1270" width="520" height="190" rx="18" fill="#ffffff" stroke="#1a2e4a" stroke-width="3"/>
  <text x="1510.0" y="1337" font-size="40" font-weight="700" fill="#1a2e4a" text-anchor="middle">Coordinator link</text>
  <text x="1510.0" y="1387" font-size="34" font-weight="400" fill="#5a6a7e" text-anchor="middle">Emailed to you:</text>
  <text x="1510.0" y="1429" font-size="34" font-weight="400" fill="#5a6a7e" text-anchor="middle">bookmark it</text>
  </g>
  <g stroke="#2b4570" stroke-width="3" fill="none" marker-end="url(#arr)">
  <line x1="573" y1="1105.0" x2="646" y2="1105.0"/>
  <line x1="1173" y1="1105.0" x2="1246" y2="1105.0"/>
  <path d="M1510.0,1203 L1510.0,1235.0 L310.0,1235.0 L310.0,1266"/>
  <line x1="573" y1="1365.0" x2="646" y2="1365.0"/>
  <line x1="1173" y1="1365.0" x2="1246" y2="1365.0"/>
  </g>
  <text x="50" y="1540" font-size="40" font-weight="700" fill="#b8932a">3 · Set up your first roster<tspan font-weight="400" font-size="34" fill="#5a6a7e">  (20–30 minutes, once per roster)</tspan></text>
  <g>
  <rect x="50" y="1580" width="520" height="190" rx="18" fill="#ffffff" stroke="#1a2e4a" stroke-width="3"/>
  <text x="310.0" y="1647" font-size="40" font-weight="700" fill="#1a2e4a" text-anchor="middle">Name, roles, season</text>
  <text x="310.0" y="1697" font-size="34" font-weight="400" fill="#5a6a7e" text-anchor="middle">What the roster is</text>
  <text x="310.0" y="1739" font-size="34" font-weight="400" fill="#5a6a7e" text-anchor="middle">and when it runs</text>
  <rect x="72" y="1557" width="86" height="46" rx="23" fill="#b8932a" stroke="#f7f9fb" stroke-width="4"/>
  <text x="115" y="1590" font-size="30" font-weight="700" fill="#ffffff" text-anchor="middle">1A</text>
  </g>
  <g>
  <rect x="650" y="1580" width="520" height="190" rx="18" fill="#ffffff" stroke="#1a2e4a" stroke-width="3"/>
  <text x="910.0" y="1647" font-size="40" font-weight="700" fill="#1a2e4a" text-anchor="middle">Get volunteers in</text>
  <text x="910.0" y="1697" font-size="34" font-weight="400" fill="#5a6a7e" text-anchor="middle">Connect your database,</text>
  <text x="910.0" y="1739" font-size="34" font-weight="400" fill="#5a6a7e" text-anchor="middle">or import a list</text>
  <rect x="672" y="1557" width="86" height="46" rx="23" fill="#b8932a" stroke="#f7f9fb" stroke-width="4"/>
  <text x="715" y="1590" font-size="30" font-weight="700" fill="#ffffff" text-anchor="middle">1B</text>
  </g>
  <g>
  <rect x="1250" y="1580" width="520" height="190" rx="18" fill="#fdf3dc" stroke="#b8932a" stroke-width="5"/>
  <text x="1510.0" y="1647" font-size="40" font-weight="700" fill="#1a2e4a" text-anchor="middle">Set up each volunteer</text>
  <text x="1510.0" y="1697" font-size="34" font-weight="400" fill="#5a6a7e" text-anchor="middle">Roles, how often,</text>
  <text x="1510.0" y="1739" font-size="34" font-weight="400" fill="#5a6a7e" text-anchor="middle">who they serve with</text>
  <rect x="1272" y="1557" width="86" height="46" rx="23" fill="#b8932a" stroke="#f7f9fb" stroke-width="4"/>
  <text x="1315" y="1590" font-size="30" font-weight="700" fill="#ffffff" text-anchor="middle">1C</text>
  </g>
  <g>
  <rect x="50" y="1840" width="520" height="190" rx="18" fill="#ffffff" stroke="#1a2e4a" stroke-width="3"/>
  <text x="310.0" y="1928" font-size="40" font-weight="700" fill="#1a2e4a" text-anchor="middle">Review &amp; create</text>
  <text x="310.0" y="1978" font-size="34" font-weight="400" fill="#5a6a7e" text-anchor="middle">Check, then Create Roster</text>
  <rect x="72" y="1817" width="86" height="46" rx="23" fill="#b8932a" stroke="#f7f9fb" stroke-width="4"/>
  <text x="115" y="1850" font-size="30" font-weight="700" fill="#ffffff" text-anchor="middle">1D</text>
  </g>
  <g stroke="#2b4570" stroke-width="3" fill="none" marker-end="url(#arr)">
  <line x1="573" y1="1675.0" x2="646" y2="1675.0"/>
  <line x1="1173" y1="1675.0" x2="1246" y2="1675.0"/>
  <path d="M1510.0,1773 L1510.0,1805.0 L310.0,1805.0 L310.0,1836"/>
  </g>
  <rect x="650" y="1840" width="1120" height="190" rx="18" fill="#fff1c2"/>
  <text x="686" y="1886" font-size="40" font-weight="700" fill="#1a2e4a" text-anchor="start">Decide at 1C</text>
  <text x="686" y="1930" font-size="34" font-weight="400" fill="#1a2e4a" text-anchor="start">•  Set roles yourself, or ask volunteers at 2C</text>
  <text x="686" y="1968" font-size="34" font-weight="400" fill="#1a2e4a" text-anchor="start">•  Ask availability at 2D? Yes, the first time</text>
  <text x="686" y="2006" font-size="34" font-weight="400" fill="#1a2e4a" text-anchor="start">•  A volunteer with no roles is left out of the build</text>
  <text x="50" y="2100" font-size="40" font-weight="700" fill="#b8932a">4 · Roster cycle: build, check, send<tspan font-weight="400" font-size="34" fill="#5a6a7e">  (about 10 minutes each time)</tspan></text>
  <g>
  <rect x="50" y="2140" width="520" height="190" rx="18" fill="#ffffff" stroke="#1a2e4a" stroke-width="3"/>
  <text x="310.0" y="2228" font-size="40" font-weight="700" fill="#1a2e4a" text-anchor="middle">Confirm Dates</text>
  <text x="310.0" y="2278" font-size="34" font-weight="400" fill="#5a6a7e" text-anchor="middle">Which dates to build</text>
  <rect x="72" y="2117" width="86" height="46" rx="23" fill="#b8932a" stroke="#f7f9fb" stroke-width="4"/>
  <text x="115" y="2150" font-size="30" font-weight="700" fill="#ffffff" text-anchor="middle">2A</text>
  </g>
  <g>
  <rect x="650" y="2140" width="520" height="190" rx="18" fill="#ffffff" stroke="#1a2e4a" stroke-width="3"/>
  <text x="910.0" y="2228" font-size="40" font-weight="700" fill="#1a2e4a" text-anchor="middle">Roles</text>
  <text x="910.0" y="2278" font-size="34" font-weight="400" fill="#5a6a7e" text-anchor="middle">How many each role needs</text>
  <rect x="672" y="2117" width="86" height="46" rx="23" fill="#b8932a" stroke="#f7f9fb" stroke-width="4"/>
  <text x="715" y="2150" font-size="30" font-weight="700" fill="#ffffff" text-anchor="middle">2B</text>
  </g>
  <g>
  <rect x="1250" y="2140" width="520" height="190" rx="18" fill="#ffffff" stroke="#1a2e4a" stroke-width="3" stroke-dasharray="14 9"/>
  <text x="1510.0" y="2228" font-size="40" font-weight="700" fill="#1a2e4a" text-anchor="middle">Role Prefs</text>
  <text x="1510.0" y="2278" font-size="34" font-weight="400" fill="#5a6a7e" text-anchor="middle">Ask which roles suit them</text>
  <rect x="1272" y="2117" width="86" height="46" rx="23" fill="#b8932a" stroke="#f7f9fb" stroke-width="4"/>
  <text x="1315" y="2150" font-size="30" font-weight="700" fill="#ffffff" text-anchor="middle">2C</text>
  </g>
  <g>
  <rect x="50" y="2400" width="520" height="190" rx="18" fill="#ffffff" stroke="#1a2e4a" stroke-width="3" stroke-dasharray="14 9"/>
  <text x="310.0" y="2467" font-size="40" font-weight="700" fill="#1a2e4a" text-anchor="middle">Availability</text>
  <text x="310.0" y="2517" font-size="34" font-weight="400" fill="#5a6a7e" text-anchor="middle">Poll the dates</text>
  <text x="310.0" y="2559" font-size="34" font-weight="400" fill="#5a6a7e" text-anchor="middle">people can&#x27;t do</text>
  <rect x="72" y="2377" width="86" height="46" rx="23" fill="#b8932a" stroke="#f7f9fb" stroke-width="4"/>
  <text x="115" y="2410" font-size="30" font-weight="700" fill="#ffffff" text-anchor="middle">2D</text>
  </g>
  <g>
  <rect x="650" y="2400" width="520" height="190" rx="18" fill="#ffffff" stroke="#1a2e4a" stroke-width="3"/>
  <text x="910.0" y="2467" font-size="40" font-weight="700" fill="#1a2e4a" text-anchor="middle">Build &amp; Check</text>
  <text x="910.0" y="2517" font-size="34" font-weight="400" fill="#5a6a7e" text-anchor="middle">Check the Board.</text>
  <text x="910.0" y="2559" font-size="34" font-weight="400" fill="#5a6a7e" text-anchor="middle">Nothing is sent yet</text>
  <rect x="672" y="2377" width="86" height="46" rx="23" fill="#b8932a" stroke="#f7f9fb" stroke-width="4"/>
  <text x="715" y="2410" font-size="30" font-weight="700" fill="#ffffff" text-anchor="middle">2E</text>
  </g>
  <g>
  <rect x="1250" y="2400" width="520" height="190" rx="18" fill="#fdf3dc" stroke="#b8932a" stroke-width="5"/>
  <text x="1510.0" y="2467" font-size="40" font-weight="700" fill="#1a2e4a" text-anchor="middle">Notify</text>
  <text x="1510.0" y="2517" font-size="34" font-weight="400" fill="#5a6a7e" text-anchor="middle">Test modes off,</text>
  <text x="1510.0" y="2559" font-size="34" font-weight="400" fill="#5a6a7e" text-anchor="middle">then send</text>
  <rect x="1272" y="2377" width="86" height="46" rx="23" fill="#b8932a" stroke="#f7f9fb" stroke-width="4"/>
  <text x="1315" y="2410" font-size="30" font-weight="700" fill="#ffffff" text-anchor="middle">2F</text>
  </g>
  <g stroke="#2b4570" stroke-width="3" fill="none" marker-end="url(#arr)">
  <line x1="573" y1="2235.0" x2="646" y2="2235.0"/>
  <line x1="1173" y1="2235.0" x2="1246" y2="2235.0"/>
  <path d="M1510.0,2333 L1510.0,2365.0 L310.0,2365.0 L310.0,2396"/>
  <line x1="573" y1="2495.0" x2="646" y2="2495.0"/>
  <line x1="1173" y1="2495.0" x2="1246" y2="2495.0"/>
  </g>
  <path d="M1510.0,2593 L1510.0,2626 L20,2626 L20,2235.0 L45,2235.0" stroke="#b8932a" stroke-width="4" stroke-dasharray="14 9" fill="none" marker-end="url(#arrGold)"/>
  <text x="50" y="2684" font-size="34" font-weight="700" fill="#b8932a" text-anchor="start">↺ Next time, start at 2A. Only volunteers new since the last build need setting up.</text>
</svg>
